# Run `pre-commit install` once after cloning; then every commit is checked.
# Run `pre-commit run --all-files` to check the whole tree by hand.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  # C sources and headers. astyle_py bundles astyle itself, so the formatter
  # version is pinned here rather than depending on whatever is installed.
  - repo: https://github.com/igrr/astyle_py
    rev: v1.1.0
    hooks:
      - id: astyle_py
        args: [--astyle-version=3.4.7, --options=.astylerc]

  # CMake
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [pyyaml]
      - id: cmake-lint
        additional_dependencies: [pyyaml]

  # Spelling, everywhere
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
